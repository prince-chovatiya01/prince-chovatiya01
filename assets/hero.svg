  <circle cx="230" cy="110" r="18" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="230" cy="110" r="4" fill="#3fb950"/>
  <text x="230" y="78" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.5" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="1">CODE</text>
  <text x="230" y="146" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">Algorithmic</text>

  <!-- Right Node 1: RESEARCH -->
  <circle cx="630" cy="110" r="18" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="630" cy="110" r="4" fill="#a371f7"/>
  <text x="630" y="78" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.5" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="1">RESEARCH</text>
  <text x="630" y="146" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">IEEE DSAA '26</text>

  <!-- Right Node 2: INTELLIGENCE -->
  <circle cx="770" cy="110" r="18" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="770" cy="110" r="4" fill="#f0883e"/>
  <text x="770" y="78" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.5" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="1">INTELLIGENCE</text>
  <text x="770" y="146" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">LLM &amp; Eval</text>


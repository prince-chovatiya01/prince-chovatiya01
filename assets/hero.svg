  <line x1="90" y1="110" x2="386" y2="110" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <line x1="474" y1="110" x2="770" y2="110" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- Left Node 1: SYSTEMS -->
  <circle cx="90" cy="110" r="18" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="90" cy="110" r="4" fill="#58a6ff"/>
  <text x="90" y="78" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.5" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="1">SYSTEMS</text>
  <text x="90" y="146" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">Distributed</text>


  <circle cx="430" cy="110" r="44" fill="#161b22" stroke="#388bfd" stroke-width="1.2"/>
  <circle cx="430" cy="110" r="40" fill="#0d1117" stroke="#30363d" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="430" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle" letter-spacing="0.5">PRINCE</text>
  <text x="430" y="122" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8.5" font-weight="500" fill="#79c0ff" text-anchor="middle" letter-spacing="1.2">CORE NODE</text>


  <text x="40" y="202" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8" fill="#6e7681">ARCHITECTURE // PARADIGM : MINIMAL · HIGH PERFORMANCE · MATHEMATICAL</text>
  <text x="820" y="202" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="8" fill="#3fb950" text-anchor="end">● STATUS : ACTIVE</text>

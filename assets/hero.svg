    <line x1="40" y1="0" x2="40" y2="220" />
    <line x1="210" y1="0" x2="210" y2="220" />
    <line x1="430" y1="0" x2="430" y2="220" />
    <line x1="650" y1="0" x2="650" y2="220" />
    <line x1="820" y1="0" x2="820" y2="220" />
    <line x1="0" y1="40" x2="860" y2="40" />
    <line x1="0" y1="110" x2="860" y2="110" />
    <line x1="0" y1="180" x2="860" y2="180" />
  </g>

  <!-- Top Metadata Header -->
  <text x="40" y="28" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9" fill="#58a6ff" letter-spacing="1.5">SYS.ID // 0xPRINCE_CHOVATIYA</text>
  <text x="820" y="28" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="9" fill="#8b949e" text-anchor="end" letter-spacing="1.2">LOC : DA-IICT · GS '26</text>

  <!-- Central Identity Box -->
